<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <meta name="description" content="LumiTalk is a child-friendly AAC communication and learning app.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script>
      if (matchMedia("(max-width:900px)").matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
        location.replace(`mobile/${location.search}${location.hash}`);
      }
    </script>
    <title>LumiTalk — Helping Every Child Find Their Voice.</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css?v=39">
    <link rel="stylesheet" href="css/themes.css?v=10">
    <link rel="stylesheet" href="css/animations.css?v=10">
    <link rel="stylesheet" href="css/responsive.css?v=14">
    <link rel="stylesheet" href="css/memory-journey.css?v=39">
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to activity</a>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="app-header">
      <button class="brand" type="button" data-route="home" aria-label="LumiTalk home">
        <img class="brand-mark" src="assets/icons/lumitalk-mark.svg" alt="">
        <span class="brand-copy">
          <strong><span class="lumi">Lumi</span><span class="talk">Talk</span></strong>
        </span>
      </button>
      <div class="header-actions">
        <button class="reward-pill" type="button" data-route="rewards" aria-label="Open rewards">
          <span aria-hidden="true">⭐</span><span id="header-stars">0</span>
        </button>
        <button class="parent-header-button" type="button" data-route="parent" aria-label="Open secure Parent Area"><span aria-hidden="true">👤</span> Parent</button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1">
      <section class="loading">
        <img class="splash-logo" src="assets/icons/lumitalk-mark.svg" alt="">
        <h1>LumiTalk</h1><p>Helping Every Child Find Their Voice.</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-route="home"><span>🏡</span><small>Home</small></button>
      <button type="button" data-route="communication"><span>💬</span><small>Talk</small></button>
      <button type="button" data-route="learning"><span>📚</span><small>Learn</small></button>
      <button type="button" data-route="sensory"><span>🫧</span><small>Play</small></button>
      <button type="button" data-route="rewards"><span>🌻</span><small>Garden</small></button>
      <button class="mobile-only" type="button" data-route="mobile-tools"><span>🧰</span><small>My Tools</small></button>
    </nav>

    <button class="mobile-only mobile-break" type="button" data-mobile-break aria-label="I need a break">⏸️ <span>I need a break</span></button>
    <button id="guided-exit" class="mobile-only guided-exit" type="button" data-guided-exit hidden aria-label="Exit guided child mode">🔒 Exit</button>

    <aside id="pip" class="pip" aria-live="polite" aria-atomic="true">
      <button class="pip-circle" type="button" data-action="repeat-pip" aria-label="Pip the guide. Repeat message.">
        <span id="pip-expression">😊</span>
      </button>
      <div id="pip-bubble" class="pip-bubble">Hi, friend! What should we explore?</div>
    </aside>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="assertive"></div>

    <script src="js/storage.js?v=39"></script>
    <script src="js/voice-library.js?v=10"></script>
    <script src="js/speech.js?v=10"></script>
    <script src="js/audio.js?v=10"></script>
    <script src="js/rewards.js?v=10"></script>
    <script src="js/accessibility.js?v=39"></script>
    <script src="games/alphabet.js?v=10"></script>
    <script src="games/numbers.js?v=10"></script>
    <script src="games/colors.js?v=10"></script>
    <script src="games/shapes.js?v=10"></script>
    <script src="games/matching.js?v=10"></script>
    <script src="games/emotions.js?v=10"></script>
    <script src="games/music.js?v=10"></script>
    <script src="games/nature.js?v=10"></script>
    <script src="games/puzzles.js?v=10"></script>
    <script src="games/dailylife.js?v=10"></script>
    <script src="games/socialskills.js?v=10"></script>
    <script src="js/mobile-tools.js?v=39"></script>
    <script src="js/settings.js?v=39"></script>
    <script src="js/navigation.js?v=10"></script>
    <script src="js/memory-journey.js?v=39"></script>
    <script src="js/app.js?v=39"></script>
  </body>
</html>
