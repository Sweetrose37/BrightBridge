<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#7055b8">
    <title>Refreshing BrightBridge</title>
    <style>
      *{box-sizing:border-box}
      body{display:grid;min-height:100vh;margin:0;place-items:center;padding:24px;background:#f6f1ff;color:#20304a;font-family:Arial,sans-serif;text-align:center}
      main{width:min(440px,100%);padding:30px;border-radius:28px;background:#fffaf5;box-shadow:0 18px 50px rgba(34,26,60,.18)}
      .mark{display:grid;width:76px;height:76px;margin:0 auto 18px;place-items:center;border-radius:50%;background:#7055b8;color:white;font-size:38px;font-weight:900}
      h1{margin:0 0 12px;font-size:30px}p{font-size:18px;line-height:1.5}
      a{display:inline-block;margin-top:12px;padding:15px 22px;border-radius:18px;background:#7055b8;color:white;font-size:18px;font-weight:800;text-decoration:none}
    </style>
  </head>
  <body>
    <main>
      <div class="mark">B</div>
      <h1>Refreshing BrightBridge</h1>
      <p id="status">Getting the newest mobile version…</p>
      <a id="continue" href="./mobile/?fresh=23" hidden>Open BrightBridge Mobile</a>
    </main>
    <script>
      (async function () {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(registration => registration.unregister()));
          }
          if ("caches" in window) {
            const names = await caches.keys();
            await Promise.all(names.filter(name => name.startsWith("brightbridge-")).map(name => caches.delete(name)));
          }
        } finally {
          document.querySelector("#status").textContent = "The newest version is ready. Your saved progress was kept.";
          document.querySelector("#continue").hidden = false;
          setTimeout(() => location.replace("./mobile/?fresh=23"), 900);
        }
      })();
    </script>
  </body>
</html>
