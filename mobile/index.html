<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <meta name="description" content="LumiTalk is a child-friendly AAC communication and learning app.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>LumiTalk — Helping Every Child Find Their Voice.</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="../assets/icons/icon.svg">
    <link rel="stylesheet" href="mobile.css?v=39">
  </head>
  <body class="mobile-app">
    <a class="mobile-skip" href="#view">Skip to activity</a>
    <header class="mobile-header">
      <button class="mobile-brand" type="button" data-route="home" aria-label="LumiTalk home">
        <img src="../assets/icons/lumitalk-mark.svg" alt=""><strong><span class="lumi">Lumi</span><span class="talk">Talk</span></strong>
      </button>
      <div class="mobile-header-actions">
        <button class="mobile-stars" type="button" data-route="rewards" aria-label="Open rewards">⭐ <span id="header-stars">0</span></button>
        <button class="mobile-parent" type="button" data-route="parent" aria-label="Open secure Parent Area"><span aria-hidden="true">👤</span><strong>Parent</strong></button>
      </div>
    </header>

    <main id="view" class="mobile-view" tabindex="-1">
      <section class="mobile-loading"><img src="../assets/icons/lumitalk-mark.svg" alt=""><h1>LumiTalk</h1><p>Helping Every Child Find Their Voice.</p></section>
    </main>

    <aside id="pip" class="mobile-pip" aria-live="polite" aria-atomic="true">
      <button type="button" data-action="repeat-pip" aria-label="Repeat Pip's message"><span id="pip-expression">😊</span></button>
      <p id="pip-bubble">Hi, friend!</p>
    </aside>

    <button id="guided-exit" class="mobile-guided-exit" type="button" data-mt-guided-exit hidden>🔒 Exit guided mode</button>

    <nav class="mobile-bottom-nav" aria-label="Main navigation">
      <button type="button" data-route="home"><span>🏠</span><small>Home</small></button>
      <button type="button" data-route="communication"><span>💬</span><small>Talk</small></button>
      <button type="button" data-route="learning"><span>📚</span><small>Learn</small></button>
      <button type="button" data-route="calm"><span>☁️</span><small>Calm</small></button>
      <button type="button" data-route="more"><span>✨</span><small>More</small></button>
    </nav>

    <div id="modal-root"></div>
    <div id="toast-root" class="mobile-toast-root" aria-live="assertive"></div>

    <script src="../js/storage.js?v=39"></script>
    <script src="../js/voice-library.js?v=39"></script>
    <script src="../js/speech.js?v=29"></script>
    <script src="../js/audio.js?v=29"></script>
    <script src="../js/rewards.js?v=29"></script>
    <script src="../js/accessibility.js?v=39"></script>
    <script src="../games/alphabet.js?v=29"></script>
    <script src="../games/numbers.js?v=29"></script>
    <script src="../games/colors.js?v=29"></script>
    <script src="../games/shapes.js?v=29"></script>
    <script src="../games/matching.js?v=29"></script>
    <script src="../games/emotions.js?v=29"></script>
    <script src="../games/music.js?v=29"></script>
    <script src="../games/nature.js?v=29"></script>
    <script src="../games/puzzles.js?v=29"></script>
    <script src="../games/dailylife.js?v=29"></script>
    <script src="../games/socialskills.js?v=29"></script>
    <script src="extra-games.js?v=29"></script>
    <script src="mobile-tools.js?v=39"></script>
    <script src="approved-videos.js?v=29"></script>
    <script src="video-approvals.js?v=29"></script>
    <script src="communication-cards.js?v=39"></script>
    <script src="parent-voices.js?v=39"></script>
    <script src="daily-reports.js?v=39"></script>
    <script src="weekly-rewards.js?v=39"></script>
    <script src="talk-read-data.js?v=39"></script>
    <script src="talk-read-storage.js?v=39"></script>
    <script src="talk-read.js?v=39"></script>
    <script src="mobile.js?v=39"></script>
  </body>
</html>
